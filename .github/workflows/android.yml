name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Gerar o app e o HTML único
        run: npm run build

      - name: Criar o projeto Android (só é criado nesta execução)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Usar a chave fixa de assinatura
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Gerar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: quadro-de-estudos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar o HTML para baixar
        uses: actions/upload-artifact@v4
        with:
          name: meu-quadro-html
          path: dist-standalone/Meu-Quadro-de-Estudos.html
